<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>randlibjs in the browser</title>
  <!-- the global `randlib` is defined by the CDN bundle -->
  <script src="https://cdn.jsdelivr.net/npm/randlibjs@2/dist/randlib.min.js"></script>
</head>
<body>
  <pre id="out"></pre>
  <script>
    randlib.seed(42)
    const rng = randlib.createGenerator(42, 'pcg64')
    document.getElementById('out').textContent = [
      'normal(0, 1, 5):          ' + JSON.stringify(randlib.normal(0, 1, 5)),
      'default_rng(42).random(): ' + rng.random(),
      'dice:                     ' + randlib.integers(1, 6, 10, true).join(' '),
      'stats.norm.ppf(0.975):    ' + randlib.stats.normal().ppf(0.975),
    ].join('\n')
  </script>
</body>
</html>
