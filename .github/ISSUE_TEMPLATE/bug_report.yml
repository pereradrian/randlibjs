name: Bug report
description: Wrong results, errors or crashes
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the expected and the actual output.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A seeded snippet makes random bugs reproducible.
      render: js
      placeholder: |
        import { seed, gamma } from 'randlibjs'
        seed(42)
        console.log(gamma(0.5, 1, 5))
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: randlibjs version
      placeholder: 2.0.0
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Node 22 / Chrome 140 / bundler
