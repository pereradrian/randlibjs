version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # TypeScript 7 emits looser declarations from our JSDoc (more `any`, lost callback
      # signatures); revisit when its JS declaration emit matches 5.x.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # numpy for the parity check: tracks every numpy release (hashes are updated too)
  - package-ecosystem: pip
    directory: /scripts/parity
    schedule:
      interval: weekly
