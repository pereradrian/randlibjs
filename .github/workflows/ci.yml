name: Node.js CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build bundles and type declarations
        run: npm run build

      - name: Type check the declarations
        run: npx tsc -p tsconfig.check.json

      - name: Run tests
        run: npm test

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - run: npm ci

      - name: Run tests with coverage
        run: npm run coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          use_oidc: true
          fail_ci_if_error: false

  package:
    # checks what users actually install: export maps, types, bundle size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - run: npm ci

      - run: npm run build

      - name: Lint the package (publint)
        run: npx publint --strict

      - name: Check the type declarations resolve everywhere (Are the Types Wrong)
        run: npx attw --pack .

      - name: Bundle size budget (size-limit)
        run: npx size-limit
