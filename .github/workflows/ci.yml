name: Node.js CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build bundles and type declarations
        run: npm run build

      - name: Type check the declarations
        run: npx tsc -p tsconfig.check.json

      - name: Run tests
        run: npm test

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      - run: npm ci

      - name: Run tests with coverage
        run: npm run coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          use_oidc: true
          fail_ci_if_error: false

  package:
    # checks what users actually install: export maps, types, bundle size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      - run: npm ci

      - run: npm run build

      - name: Lint the package (publint)
        run: npx publint --strict

      - name: Check the type declarations resolve everywhere (Are the Types Wrong)
        run: npx attw --pack .

      - name: Bundle size budget (size-limit)
        run: npx size-limit

      - name: README claims
        run: npm run check:claims

      # the oldest Node in "engines": the test tools need a newer one, so only the packed package runs on it
      - name: Unpack the package for the smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/smoke/node_modules/randlibjs"
          tarball=$(npm pack --silent --pack-destination "$RUNNER_TEMP" | tail -n 1)
          tar -xzf "$RUNNER_TEMP/$tarball" --strip-components=1 -C "$RUNNER_TEMP/smoke/node_modules/randlibjs"
          cp scripts/smoke.mjs "$RUNNER_TEMP/smoke/"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 18.x

      - name: Smoke test on Node 18
        run: cd "$RUNNER_TEMP/smoke" && node smoke.mjs
