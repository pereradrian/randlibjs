name: Publish to npm

# Runs when a version tag (e.g. v2.0.0) is pushed. Publishes with npm trusted
# publishing (OIDC): no token is stored. The package's settings on npmjs.com must
# list this repository and workflow file (release.yml) as a trusted publisher.
# The version is staged, not published: approve it on npmjs.com or with
# `npm stage approve <stage-id>` (2FA) to make it live.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing and provenance
      attestations: write # build provenance for the release assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      # npm stage needs npm 11.15 or newer; Node 24.22+ bundles npm 11.19, so nothing is installed
      - name: Check the bundled npm supports staged publishing
        run: node -e "const [a,b]=process.argv[1].split('.').map(Number); if (a < 11 || (a === 11 && b < 15)) { console.error('npm ' + process.argv[1] + ' is too old for npm stage'); process.exit(1) }" "$(npm --version)"

      - run: npm ci

      - name: Check tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Stage the release on npm
        run: npm stage publish . --provenance --access public

      - name: Build provenance for the browser bundles
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/randlib.min.js
            dist/randlib.js
            dist/randlib.mjs
            dist/randlib.cjs

      - name: Create GitHub release with signed provenance
        run: |
          cp "$BUNDLE" randlib.intoto.jsonl
          # created as a draft with every asset, then published: works with immutable releases
          gh release create "${GITHUB_REF_NAME}" --draft --generate-notes --title "${GITHUB_REF_NAME}" \
            dist/randlib.min.js dist/randlib.js dist/randlib.mjs dist/randlib.cjs randlib.intoto.jsonl
          gh release edit "${GITHUB_REF_NAME}" --draft=false
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
