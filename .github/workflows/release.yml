name: Publish to npm

# Runs when a version tag (e.g. v2.0.0) is pushed. Publishes with npm trusted
# publishing (OIDC): no token is stored. The package's settings on npmjs.com must
# list this repository and workflow file (release.yml) as a trusted publisher.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      # trusted publishing needs npm 11.5.1 or newer
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Check tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

      # prepublishOnly runs lint, tests and the build
      - run: npm publish --provenance --access public

      - name: Create GitHub release
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --title "${GITHUB_REF_NAME}" dist/randlib.min.js dist/randlib.js dist/randlib.mjs dist/randlib.cjs
        env:
          GH_TOKEN: ${{ github.token }}
