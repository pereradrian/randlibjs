# Regenerates numpy streams with the latest numpy release and checks that randlibjs reproduces
# them (78,000+ values over 4 bit generators, 5 seeds and 17 samplers, plus RandomState).
name: numpy parity

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      # numpy is pinned with hashes in scripts/parity/requirements.txt and Dependabot bumps it to
      # every new release, so this checks the latest numpy with verifiable downloads
      - name: Install numpy
        run: pip install --require-hashes --no-deps -r scripts/parity/requirements.txt

      - run: npm ci

      - name: Draw the reference streams with numpy
        run: python scripts/numpy_parity.py > parity.json

      - name: Compare with randlibjs
        run: node scripts/check-numpy-parity.mjs parity.json
